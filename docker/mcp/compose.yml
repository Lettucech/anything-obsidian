name: anything-obsidian

services:
  mcp:
    build:
      context: ../../mcp/anythingllm
    container_name: anything-obsidian-mcp
    restart: unless-stopped
    env_file:
      - path: ../../.env
        required: false
    environment:
      ANYTHINGLLM_BASE_URL: http://anything-obsidian-anythingllm:3001
      MCP_TRANSPORT: http
      MCP_PORT: "3333"
    command:
      - sh
      - -c
      - |
        test -n "$$ANYTHINGLLM_API_KEY" || {
          echo "Set ANYTHINGLLM_API_KEY in the tooling repo root .env before starting MCP." >&2
          exit 1
        }
        node dist/index.js --http
    ports:
      - "${HOST_MCP_PORT:-11333}:3333"
    networks:
      - anything-obsidian

  embed:
    image: node:22-alpine
    profiles:
      - tools
    env_file:
      - path: ../../.env
        required: false
    working_dir: /workspace
    volumes:
      - ../..:/workspace
      - ${HOST_VAULT_PATH:?Set HOST_VAULT_PATH in the tooling repo root .env}:/vault:ro
    environment:
      ANYTHINGLLM_BASE_URL: http://anything-obsidian-anythingllm:3001
      VAULT_PATH: /vault
    command:
      - sh
      - -c
      - |
        test -n "$$ANYTHINGLLM_API_KEY" || {
          echo "Set ANYTHINGLLM_API_KEY in the tooling repo root .env before embedding." >&2
          exit 1
        }
        node scripts/embed-vault.mjs
    networks:
      - anything-obsidian

  sync:
    build:
      context: ../..
      dockerfile: docker/automation/Dockerfile
    container_name: anything-obsidian-sync
    restart: unless-stopped
    env_file:
      - path: ../../.env
        required: false
    working_dir: /workspace
    volumes:
      - ../..:/workspace
      - ${HOST_VAULT_PATH:?Set HOST_VAULT_PATH in the tooling repo root .env}:/vault
    environment:
      ANYTHINGLLM_BASE_URL: http://anything-obsidian-anythingllm:3001
      VAULT_PATH: /vault
    command:
      - sh
      - -c
      - |
        test -n "$$ANYTHINGLLM_API_KEY" || {
          echo "Set ANYTHINGLLM_API_KEY in the tooling repo root .env before starting auto sync." >&2
          exit 1
        }
        node scripts/watch-vault.mjs
    networks:
      - anything-obsidian

networks:
  anything-obsidian:
    name: anything-obsidian
    external: true

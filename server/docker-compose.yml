# The any-obs server stack: one shared AnythingLLM plus the IAM gateway.
#   docker compose up -d
# Then open http://<server>:21500 and run the setup wizard in the dashboard —
# no .env values are required (server/.env exists only for optional
# non-interactive overrides).
#
# AnythingLLM's UI is reachable for first-boot setup on the host loopback
# only (127.0.0.1:21501): on the server itself, or via
#   ssh -L 21501:127.0.0.1:21501 <server>
# The dashboard's wizard walks you through this. Never bind it to the LAN.
services:
  anythingllm:
    image: mintplexlabs/anythingllm:latest
    restart: unless-stopped
    volumes:
      - anythingllm-storage:/app/server/storage
    # Loopback-only publish so an admin can reach the UI on the server itself
    # or over an SSH tunnel to finish first-boot setup and mint the developer
    # API key. Never on the LAN.
    ports:
      - "127.0.0.1:21501:3001"

  gateway:
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      - anythingllm
    environment:
      ANYTHINGLLM_BASE_URL: http://anythingllm:3001
      # Secrets are optional: the dashboard wizard collects them into the
      # data volume. Set them here only for non-interactive deployments.
      ANYTHINGLLM_API_KEY: ${ANYTHINGLLM_API_KEY:-}
      GATEWAY_ADMIN_TOKEN: ${GATEWAY_ADMIN_TOKEN:-}
      GATEWAY_BOOTSTRAP_TOKEN: ${GATEWAY_BOOTSTRAP_TOKEN:-}
      GATEWAY_PORT: "21500"
      SHARED_WORKSPACE_SLUG: ${SHARED_WORKSPACE_SLUG:-shared}
    ports:
      - "21500:21500"
    volumes:
      - gateway-data:/data

volumes:
  anythingllm-storage:
  gateway-data:

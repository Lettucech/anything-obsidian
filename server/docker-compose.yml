# The any-obs server stack: one shared AnythingLLM plus the IAM gateway.
#   docker compose up -d
# Then open the gateway admin dashboard and run the setup wizard —
# no .env values are required (server/.env exists only for optional
# non-interactive overrides).
#
# Two planes, same trust model as the client (loopback dashboard, LAN service):
#   :21500 public  — MCP + user API, published on the LAN, user token required
#   :21505 admin   — dashboard + setup + management, HOST LOOPBACK ONLY
#                    (reach it on the server or ssh -L 21505:127.0.0.1:21505;
#                    server access is the admin credential)
# AnythingLLM's UI is likewise loopback-only on 127.0.0.1:21501 for
# first-boot setup (ssh -L 21501:127.0.0.1:21501).
services:
  anythingllm:
    image: mintplexlabs/anythingllm:latest
    restart: unless-stopped
    environment:
      # The official image warns (and may not persist data) without this —
      # it must point at the mounted volume.
      STORAGE_DIR: /app/server/storage
    volumes:
      - anythingllm-storage:/app/server/storage
    # Loopback-only publish so an admin can reach the UI on the server itself
    # or over an SSH tunnel to finish first-boot setup and mint the developer
    # API key. Never on the LAN.
    ports:
      - "127.0.0.1:21501:3001"

  gateway:
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      - anythingllm
    environment:
      ANYTHINGLLM_BASE_URL: http://anythingllm:3001
      # The API key is optional: the dashboard wizard collects it into the
      # data volume. Set it here only for non-interactive deployments.
      ANYTHINGLLM_API_KEY: ${ANYTHINGLLM_API_KEY:-}
      GATEWAY_PORT: "21500"
      GATEWAY_ADMIN_PORT: "21505"
      # Inside the container both planes bind all interfaces; the loopback
      # restriction on the admin plane is enforced by the host publish below.
      GATEWAY_BIND: 0.0.0.0
      GATEWAY_ADMIN_BIND: 0.0.0.0
    ports:
      - "21500:21500"
      - "127.0.0.1:21505:21505"
    volumes:
      - gateway-data:/data

volumes:
  anythingllm-storage:
  gateway-data:

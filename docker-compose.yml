name: anything-obsidian

services:
  dashboard:
    build:
      context: .
      dockerfile: docker/dashboard/Dockerfile
    container_name: anything-obsidian-dashboard
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_DASHBOARD_PORT:-11300}:3000"
    environment:
      HOST_DASHBOARD_PORT: ${HOST_DASHBOARD_PORT:-11300}
      HOST_ANYTHINGLLM_PORT: ${HOST_ANYTHINGLLM_PORT:-11301}
      HOST_MCP_PORT: ${HOST_MCP_PORT:-11333}
      ANYTHINGLLM_BASE_URL: http://anythingllm:3001
      ANYTHINGLLM_API_KEY: ${ANYTHINGLLM_API_KEY:-}
      VAULTS_ROOT: /vaults
      VAULT_REGISTRY_PATH: /workspace/.anything-obsidian-registry/vaults.json
      VAULT_SECRETS_PATH: /workspace/.anything-obsidian-secrets
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOST_VAULTS_ROOT:?Set HOST_VAULTS_ROOT in .env to your vault parent directory}:/vaults
      - anything-obsidian-vault-registry:/workspace/.anything-obsidian-registry
      - anything-obsidian-vault-secrets:/workspace/.anything-obsidian-secrets
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 60s

  anythingllm:
    image: mintplexlabs/anythingllm:latest
    container_name: anything-obsidian-anythingllm
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_ANYTHINGLLM_PORT:-11301}:3001"
    volumes:
      - anything-obsidian-anythingllm-storage:/app/server/storage
    environment:
      DISABLE_TELEMETRY: "true"
      STORAGE_DIR: /app/server/storage
      UID: "1000"
      GID: "1000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/v1/system/ping',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 60s

  mcp:
    build:
      context: ./mcp/anythingllm
    container_name: anything-obsidian-mcp
    restart: unless-stopped
    depends_on:
      anythingllm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3333/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 60s
    environment:
      ANYTHINGLLM_API_KEY: ${ANYTHINGLLM_API_KEY:-}
      ANYTHINGLLM_BASE_URL: http://anythingllm:3001
      VAULT_REGISTRY_PATH: /workspace/.anything-obsidian-registry/vaults.json
      MCP_TRANSPORT: http
      MCP_PORT: "3333"
    ports:
      - "127.0.0.1:${HOST_MCP_PORT:-11333}:3333"
    volumes:
      - anything-obsidian-vault-registry:/workspace/.anything-obsidian-registry:ro

  syncer:
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
    image: anything-obsidian-worker
    container_name: anything-obsidian-syncer
    restart: unless-stopped
    depends_on:
      anythingllm:
        condition: service_healthy
    environment:
      ANYTHINGLLM_BASE_URL: http://anythingllm:3001
      VAULTS_ROOT: /vaults
      VAULT_REGISTRY_PATH: /workspace/.anything-obsidian-registry/vaults.json
      VAULT_STATE_ROOT: /workspace/.anything-obsidian-state
      VAULT_SECRETS_PATH: /workspace/.anything-obsidian-secrets
    volumes:
      - ./.env:/workspace/.env:ro
      - anything-obsidian-worker-state:/workspace/.anything-obsidian-state
      - anything-obsidian-vault-registry:/workspace/.anything-obsidian-registry
      - anything-obsidian-vault-secrets:/workspace/.anything-obsidian-secrets
      - ${HOST_VAULTS_ROOT:?Set HOST_VAULTS_ROOT in .env to your vault parent directory}:/vaults
    command: ["scheduler"]

  worker:
    profiles:
      - tools
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
    image: anything-obsidian-worker
    container_name: anything-obsidian-worker
    depends_on:
      - anythingllm
    environment:
      ANYTHINGLLM_BASE_URL: http://anythingllm:3001
      VAULTS_ROOT: /vaults
      VAULT_REGISTRY_PATH: /workspace/.anything-obsidian-registry/vaults.json
      VAULT_STATE_ROOT: /workspace/.anything-obsidian-state
      VAULT_SECRETS_PATH: /workspace/.anything-obsidian-secrets
    volumes:
      - ./.env:/workspace/.env:ro
      - anything-obsidian-worker-state:/workspace/.anything-obsidian-state
      - anything-obsidian-vault-registry:/workspace/.anything-obsidian-registry
      - anything-obsidian-vault-secrets:/workspace/.anything-obsidian-secrets
      - ${HOST_VAULTS_ROOT:?Set HOST_VAULTS_ROOT in .env to your vault parent directory}:/vaults

volumes:
  anything-obsidian-anythingllm-storage:
    name: anything-obsidian-anythingllm-storage
  anything-obsidian-worker-state:
    name: anything-obsidian-worker-state
  anything-obsidian-vault-registry:
    name: anything-obsidian-vault-registry
  anything-obsidian-vault-secrets:
    name: anything-obsidian-vault-secrets
